<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<style>
:root {
  --ducks-navy: #061a4f;
  --ducks-blue: #0b56d0;
  --ducks-cyan: #18c7e8;
  --ducks-gold: #f2b84b;
  --ducks-gold-dark: #c98716;
  --ducks-white: #f7fbff;
  --ducks-muted: #b9c8e8;
  --ducks-card: rgba(7, 30, 78, 0.92);
  --ducks-card-light: rgba(12, 54, 123, 0.9);
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  min-height: 100vh;
  color: var(--ducks-white);
  background:
    radial-gradient(circle at 50% -10%, rgba(24,199,232,.32), transparent 35%),
    linear-gradient(160deg, #03113a 0%, #06205d 48%, #031238 100%);
}

main {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

.ducks-brand {
  text-align: center;
  margin: 0 0 18px;
}

.ducks-logo {
  display: block;
  width: min(250px, 68vw);
  aspect-ratio: 1 / 1;
  object-fit: cover;
  margin: 0 auto 12px;
  border: 4px solid var(--ducks-gold);
  border-radius: 28px;
  box-shadow: 0 0 0 3px rgba(24,199,232,.25), 0 12px 30px rgba(0,0,0,.4);
}

.ducks-brand-title {
  margin: 0;
  color: var(--ducks-white);
  font-size: clamp(28px, 7vw, 44px);
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 2px 12px rgba(24,199,232,.35);
}

.ducks-brand-subtitle {
  margin: 4px 0 0;
  color: var(--ducks-gold);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.card {
  background: linear-gradient(145deg, var(--ducks-card-light), var(--ducks-card));
  border: 1px solid rgba(24,199,232,.35);
  border-top: 3px solid var(--ducks-gold);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 10px 28px rgba(0,0,0,.28);
}

h1, h2, h3 { color: var(--ducks-white); }
h1 { margin-top: 0; }
h2 { margin-top: 0; color: var(--ducks-cyan); }
h3 { margin-bottom: 12px; color: var(--ducks-gold); }

input {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 2px solid rgba(185,200,232,.35);
  border-radius: 10px;
  font-size: 16px;
  background: rgba(255,255,255,.96);
  color: #111;
}

input:focus {
  outline: none;
  border-color: var(--ducks-cyan);
  box-shadow: 0 0 0 3px rgba(24,199,232,.2);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}

.checkbox-row input { width: auto; margin: 0; }

button {
  border: none;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  transition: transform .12s ease, filter .12s ease;
}

button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }

.login-btn {
  width: 100%;
  margin-top: 12px;
  color: #071a45;
  background: linear-gradient(180deg, #ffd36b, var(--ducks-gold));
  box-shadow: 0 5px 14px rgba(0,0,0,.22);
}

.add-btn {
  width: 100%;
  margin-top: 12px;
  color: white;
  background: linear-gradient(180deg, #1977e8, var(--ducks-blue));
}

.vote-buttons { display: flex; gap: 8px; margin-top: 10px; }
.vote-buttons button { flex: 1; }

.yes { background: #45b96b; color: white; }
.maybe { background: #f0c64b; color: #17223d; }
.no { background: #d95757; color: white; }

.selected {
  border: 3px solid var(--ducks-cyan);
  font-weight: 900;
  box-shadow: 0 0 0 2px rgba(24,199,232,.2);
}

.event {
  background: rgba(2, 18, 58, .72);
  border: 1px solid rgba(24,199,232,.28);
  border-left: 4px solid var(--ducks-cyan);
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 5px 16px rgba(0,0,0,.2);
}

.event-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--ducks-gold);
}

.event-info { margin-top: 6px; color: #e7efff; }

.counts {
  margin-top: 12px;
  padding-top: 9px;
  border-top: 1px solid rgba(185,200,232,.25);
  color: var(--ducks-muted);
}

.success { color: #70e79a; margin-top: 10px; font-weight: bold; }
.error { color: #ff7d7d; margin-top: 10px; font-weight: bold; }
.empty { color: var(--ducks-muted); padding: 10px 0; }

.admin-player {
  padding: 11px 0;
  border-bottom: 1px solid rgba(185,200,232,.2);
}

.player-code { margin-top: 5px; font-size: 14px; color: var(--ducks-muted); }
.small { font-size: 13px; color: var(--ducks-muted); margin-top: 3px; }

hr {
  border: none;
  border-top: 1px solid rgba(185,200,232,.22);
  margin: 20px 0;
}

.player-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.player-actions button { padding:6px 10px; }

@media screen and (max-width: 768px) {
  /* ===== Ducks Mobile 1.2 ===== */
  body {
    font-size: 18px !important;
  }

  main {
    width: 100% !important;
    max-width: 100% !important;
    padding: 12px !important;
    box-sizing: border-box !important;
  }

  h1 {
    font-size: 2rem !important;
    line-height: 1.2 !important;
  }

  h2 {
    font-size: 1.55rem !important;
    line-height: 1.25 !important;
  }

  h3 {
    font-size: 1.3rem !important;
    line-height: 1.3 !important;
  }

  .card,
  .event {
    padding: 18px !important;
    border-radius: 14px !important;
  }

  input,
  button,
  select,
  textarea {
    font-size: 18px !important;
    min-height: 52px !important;
    box-sizing: border-box !important;
  }

  .login-btn,
  .add-btn {
    min-height: 56px !important;
  }

  .vote-buttons {
    gap: 10px !important;
    flex-direction: column !important;
  }

  .vote-buttons button {
    width: 100% !important;
    min-height: 56px !important;
  }

  .event-title {
    font-size: 1.4rem !important;
  }

  .event-info,
  .counts,
  .small,
  .player-code {
    font-size: 1rem !important;
    line-height: 1.5 !important;
  }

  .admin-player {
    padding: 14px 0 !important;
  }

  .player-actions {
    gap: 8px !important;
  }

  .player-actions button {
    min-height: 50px !important;
  }
  /* ===== Ende Ducks Mobile 1.2 ===== */
}
</style>





<script>
function refreshAdminPlayers(){ if(typeof loadAdmin==='function'){ loadAdmin(); } }
</script>

  <div class="ducks-brand-title">THE DUCKS</div>
  <div class="ducks-brand-subtitle">Dart-Team</div>
</div>

  <h1>🎯 Dart-Team</h1>

  <h2>🔑 Team-Code</h2>

  <input
    id="codeInput"
    placeholder="Deinen Code eingeben">

  <button
    class="login-btn"
    onclick="login()">

    Einloggen

  </button>

  <div id="loginStatus"></div>

</div>



<div id="events">

  <div class="card">

    <h2>📅 Kommende Termine</h2>

    <div class="empty">
      Termine werden geladen …
    </div>

  </div>

</div>



<div class="card">

  <h2>👥 Mannschaft</h2>

  <div id="players">

    Spieler werden geladen …

  </div>

</div>



<div id="adminArea"></div>


</main>



<script>


let players = [];

let events = [];

let responses = [];

let currentPlayer = null;



// ======================================
// LOGIN
// ======================================

function login() {

  const code =
    document
      .getElementById('codeInput')
      .value
      .trim();


  if (!code) {

    document
      .getElementById('loginStatus')
      .innerHTML =
      '<div class="error">' +
      'Bitte Team-Code eingeben.' +
      '</div>';

    return;

  }


  google.script.run

    .withSuccessHandler(function(result) {

      if (!result.success) {

        document
          .getElementById('loginStatus')
          .innerHTML =
          '<div class="error">' +
          '❌ Code nicht gefunden' +
          '</div>';

        return;

      }


      currentPlayer =
        result.player;


      document
        .getElementById('loginStatus')
        .innerHTML =

        '<div class="success">' +

        'Willkommen ' +

        escapeHtml(
          currentPlayer.name
        ) +

        ' 🎯' +

        '</div>';


      renderEvents();

      loadAdmin();

    })

    .withFailureHandler(showError)

    .loginWithCode(code);

}



// ======================================
// SPIELER LADEN
// ======================================

function loadPlayers() {

  google.script.run

    .withSuccessHandler(function(data) {

      players = data;

      showPlayers();

    })

    .withFailureHandler(showError)

    .getPlayers();

}



// ======================================
// SPIELER ANZEIGEN
// ======================================

function showPlayers() {

  const container =
    document.getElementById('players');


  if (!players.length) {

    container.innerHTML =
      '<div class="empty">' +
      'Keine aktiven Spieler.' +
      '</div>';

    return;

  }


  container.innerHTML =

    players
      .map(function(player) {

        return `

          <div style="
            padding:8px 0;
            border-bottom:1px solid #ddd;
          ">

            <strong>
              ${escapeHtml(player.name)}
            </strong>

            ${
              player.admin
                ? ' 👑'
                : ''
            }

          </div>

        `;

      })
      .join('');

}



// ======================================
// TERMINE LADEN
// ======================================

function loadEvents() {

  google.script.run

    .withSuccessHandler(function(data) {

      events = data;

      renderEvents();

    })

    .withFailureHandler(showError)

    .getEvents();

}



// ======================================
// ANTWORTEN LADEN
// ======================================

function loadResponses() {

  google.script.run

    .withSuccessHandler(function(data) {

      responses = data;

      renderEvents();

    })

    .withFailureHandler(showError)

    .getResponses();

}



// ======================================
// TERMINE DARSTELLEN
// ======================================

function renderEvents() {

  const container =
    document.getElementById('events');


  if (!events.length) {

    container.innerHTML = `

      <div class="card">

        <h2>📅 Kommende Termine</h2>

        <div class="empty">

          Noch keine Termine eingetragen.

        </div>

      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="card">

      <h2>📅 Kommende Termine</h2>

      ${
        events
          .map(function(event) {

            return renderEvent(event);

          })
          .join('')
      }

    </div>

  `;

}



// ======================================
// EINEN TERMIN DARSTELLEN
// ======================================

function renderEvent(event) {

  const isLeague =

    String(event.type)
      .toUpperCase() ===
    'LIGASPIEL';


  let title =

    isLeague
      ? '🏆 Ligaspiel'
      : '🎯 Training';


  if (
    isLeague &&
    event.opponent
  ) {

    title +=
      ' gegen ' +
      escapeHtml(event.opponent);

  }


  let voteHtml = '';


  if (isLeague) {

    if (currentPlayer) {

      const answer =
        getPlayerResponse(
          event.id,
          currentPlayer.id
        );


      voteHtml = `

        <div style="margin-top:12px">

          <strong>
            Kannst du spielen?
          </strong>

          <div class="vote-buttons">


            <button

              class="yes ${
                answer === 'JA'
                  ? 'selected'
                  : ''
              }"

              onclick="vote(
                '${event.id}',
                '${currentPlayer.id}',
                'JA'
              )">

              🟢 Ja

            </button>


            <button

              class="maybe ${
                answer === 'VIELLEICHT'
                  ? 'selected'
                  : ''
              }"

              onclick="vote(
                '${event.id}',
                '${currentPlayer.id}',
                'VIELLEICHT'
              )">

              🟡 Vielleicht

            </button>


            <button

              class="no ${
                answer === 'NEIN'
                  ? 'selected'
                  : ''
              }"

              onclick="vote(
                '${event.id}',
                '${currentPlayer.id}',
                'NEIN'
              )">

              🔴 Nein

            </button>


          </div>


          ${
            answer
              ? `

                <div class="success">

                  Deine Antwort:
                  ${answer}

                </div>

              `
              : ''
          }

        </div>

      `;

    }

  }


  return `

    <div class="event">

      <div class="event-title">

        ${title}

      </div>


      <div class="event-info">

        📅 ${escapeHtml(event.date)}

      </div>


      <div class="event-info">

        🕐 ${escapeHtml(event.start)}

        ${
          event.end
            ? ' – ' +
              escapeHtml(event.end)
            : ''
        }

      </div>


      ${
        event.homeAway

          ? `

            <div class="event-info">

              🏠
              ${escapeHtml(event.homeAway)}

            </div>

          `

          : ''
      }


      ${
        event.location

          ? `

            <div class="event-info">

              📍
              ${escapeHtml(event.location)}

            </div>

          `

          : ''
      }


      ${
        event.description

          ? `

            <div class="event-info">

              ℹ️
              ${escapeHtml(event.description)}

            </div>

          `

          : ''
      }


      ${voteHtml}


      ${
        isLeague

          ? `

            <div class="counts">

              ${buildCounts(event.id)}

            </div>

          `

          : ''
      }


    </div>

  `;

}



// ======================================
// ABSTIMMUNG
// ======================================

function vote(
  eventId,
  playerId,
  answer
) {

  google.script.run

    .withSuccessHandler(function() {

      const existing =
        responses.find(function(r) {

          return (

            String(r.terminId) ===
            String(eventId)

            &&

            String(r.spielerId) ===
            String(playerId)

          );

        });


      if (existing) {

        existing.answer =
          answer;

      } else {

        responses.push({

          terminId:
            String(eventId),

          spielerId:
            String(playerId),

          answer:
            answer

        });

      }


      renderEvents();

    })

    .withFailureHandler(showError)

    .saveResponse(
      eventId,
      playerId,
      answer
    );

}



// ======================================
// ANTWORT EINES SPIELERS
// ======================================

function getPlayerResponse(
  eventId,
  playerId
) {

  const response =
    responses.find(function(r) {

      return (

        String(r.terminId) ===
        String(eventId)

        &&

        String(r.spielerId) ===
        String(playerId)

      );

    });


  return response
    ? response.answer
    : '';

}



// ======================================
// ABSTIMMUNGSZÄHLER
// ======================================

function buildCounts(eventId) {

  const counts = {

    JA: 0,

    VIELLEICHT: 0,

    NEIN: 0

  };


  responses.forEach(function(response) {

    if (

      String(response.terminId) ===
      String(eventId)

    ) {

      if (
        counts.hasOwnProperty(
          response.answer
        )
      ) {

        counts[
          response.answer
        ]++;

      }

    }

  });


  return `

    🟢 ${counts.JA}
    &nbsp;&nbsp;

    🟡 ${counts.VIELLEICHT}
    &nbsp;&nbsp;

    🔴 ${counts.NEIN}

  `;

}

// ======================================
// ADMIN LIGASPIEL ANZEIGEN
// ======================================

function renderAdminEvent(item) {

  return `

    <div class="event">

      <div class="event-title">

        🏆
        ${escapeHtml(
          item.event.opponent ||
          'Ligaspiel'
        )}

      </div>


      <div>

        📅
        ${escapeHtml(
          item.event.date
        )}

      </div>


      <p>

        🟢 ${item.counts.yes}

        &nbsp;&nbsp;

        🟡 ${item.counts.maybe}

        &nbsp;&nbsp;

        🔴 ${item.counts.no}

        &nbsp;&nbsp;

        ⚪ ${item.counts.open}

      </p>


      ${
        item.players
          .map(function(player) {

            return `

              <div class="admin-player">

                <span>

                  ${escapeHtml(
                    player.name
                  )}

                </span>

                <strong>

                  ${player.answer}

                </strong>

              </div>

            `;

          })
          .join('')

      }

    </div>

  `;

}



// ======================================
// ADMIN SPIELER LADEN
// ======================================

function loadAdminPlayers() {

  google.script.run

    .withSuccessHandler(function(data) {

      renderAdminPlayers(data);

    })

    .withFailureHandler(showError)

    .getPlayers();

}



// ======================================
// ADMIN SPIELER ANZEIGEN
// ======================================

function renderAdminPlayers(
  playerList
) {

  const container =
    document.getElementById(
      'adminPlayers'
    );


  if (!container) {

    return;

  }


  if (!playerList.length) {

    container.innerHTML =
      '<div class="empty">' +
      'Keine Spieler vorhanden.' +
      '</div>';

    return;

  }


  container.innerHTML =

    playerList
      .map(function(player) {

        return `

          <div
            class="admin-player">

            <div>

              <strong>

                ${escapeHtml(
                  player.name
                )}

              </strong>


              <div class="small">

                ID:
                ${escapeHtml(
                  player.id
                )}

              </div>

            </div>


            <div>

              ${
                player.admin
                  ? '👑 Admin'
                  : 'Spieler'
              }

            </div>

          </div>

        `;

      })
      .join('');

}

// ======================================
// SPIELER SPEICHERN
// ======================================

function createNewPlayer() {

  const name =
    document
      .getElementById(
        'newPlayerName'
      )
      .value
      .trim();


  const isAdmin =
    document
      .getElementById(
        'newPlayerAdmin'
      )
      .checked;


  const status =
    document
      .getElementById(
        'newPlayerStatus'
      );


  if (!name) {

    status.innerHTML =

      '<div class="error">' +

      'Bitte einen Namen eingeben.' +

      '</div>';

    return;

  }


  status.innerHTML =

    '<div>' +

    'Spieler wird gespeichert …' +

    '</div>';


  google.script.run

    .withSuccessHandler(function(result) {

      status.innerHTML = `

        <div class="success">

          Spieler erfolgreich angelegt ✅

          <br><br>

          <strong>
            ${escapeHtml(
              result.player.name
            )}
          </strong>

          <br>

          Team-Code:

          <strong>
            ${escapeHtml(
              result.player.code
            )}
          </strong>

          <br><br>

          ⚠️ Diesen Code bitte dem
          Spieler mitteilen.

        </div>

      `;


      loadPlayers();

      loadAdminPlayers();


      document
        .getElementById(
          'newPlayerName'
        )
        .value = '';


      document
        .getElementById(
          'newPlayerAdmin'
        )
        .checked = false;

    })

    .withFailureHandler(function(error) {

      status.innerHTML =

        '<div class="error">' +

        escapeHtml(
          error.message ||
          error
        ) +

        '</div>';

    })

    .createPlayer(
      name,
      isAdmin
    );

}



// ======================================
// NEUES LIGASPIEL
// ======================================

function createNewEvent() {

  const eventData = {

    date:
      document
        .getElementById('newDate')
        .value,

    start:
      document
        .getElementById('newStart')
        .value,

    end:
      document
        .getElementById('newEnd')
        .value,

    opponent:
      document
        .getElementById('newOpponent')
        .value
        .trim(),

    homeAway:
      document
        .getElementById('newHomeAway')
        .value
        .trim(),

    location:
      document
        .getElementById('newLocation')
        .value
        .trim(),

    description:
      document
        .getElementById('newDescription')
        .value
        .trim()

  };


  if (!eventData.opponent) {

    alert(
      'Bitte einen Gegner eingeben.'
    );

    return;

  }


  if (!eventData.date) {

    alert(
      'Bitte ein Datum auswählen.'
    );

    return;

  }


  if (!eventData.start) {

    alert(
      'Bitte eine Beginnzeit auswählen.'
    );

    return;

  }


  google.script.run

    .withSuccessHandler(function() {

      alert(
        'Ligaspiel gespeichert ✅'
      );


      loadEvents();

      loadAdmin();

    })

    .withFailureHandler(showError)

    .createEvent(
      eventData
    );

}



// ======================================
// FEHLER
// ======================================

function showError(error) {

  console.error(error);


  alert(

    'Fehler: ' +

    (
      error &&
      error.message
        ? error.message
        : error
    )

  );

}



// ======================================
// HTML SICHER MACHEN
// ======================================

function escapeHtml(text) {

  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    text == null
      ? ''
      : String(text);


  return div.innerHTML;

}
